config:
  operation:
    fields:
      - key: llm.prediction.temperature
        value: 1.0
      - key: llm.prediction.topKSampling
        value: 20
      - key: llm.prediction.topPSampling
        value:
          checked: true
          value: 0.95
      - key: llm.prediction.minPSampling
        value:
          checked: false
          value: 0
      - key: llm.prediction.repeatPenalty
        value:
          checked: false
          value: 1.0
      - key: llm.prediction.llama.presencePenalty
        value:
          checked: true
          value: 1.5
customFields:
  - key: enableThinking
    displayName: Enable Thinking
    description: Controls whether the model will think before replying
    type: boolean
    defaultValue: true
    effects:
      - type: setJinjaVariable
        variable: enable_thinking
  - key: preserveThinking
    displayName: Preserve Thinking
    description: Retains reasoning context across conversation history
    type: boolean
    defaultValue: true
    effects:
      - type: setJinjaVariable
        variable: preserve_thinking
metadataOverrides:
  domain: llm
  architectures:
    - qwen35
  compatibilityTypes:
    - gguf
    - safetensors
  paramsStrings:
    - 27B
  minMemoryUsageBytes: 16000000000
  contextLengths:
    - 262144
  vision: true
  reasoning: true
  trainedForToolUse: true
