  domain: llm
  architectures:
    - qwen35
  compatibilityTypes:
    - gguf
  paramsStrings:
    - 35B
  minMemoryUsageBytes: 21000000000
  contextLengths:
    - 262144
  vision: true
  reasoning: true
  trainedForToolUse: true
