# model.yaml is an open standard for defining cross-platform, composable AI models
# Learn more at https://modelyaml.org
model: zai-org/glm-5
base:
  - key: Doctor-Shotgun/GLM-5-GGUF
    sources:
      - type: huggingface
        user: Doctor-Shotgun
        repo: GLM-5-GGUF
  - key: ubergarm/GLM-5-GGUF
    sources:
      - type: huggingface
        user: ubergarm
        repo: GLM-5-GGUF
  - key: unsloth/GLM-5-GGUF
    sources:
      - type: huggingface
        user: unsloth
        repo: GLM-5-GGUF
  - key: gghfez/GLM-5-control-vectors
    sources:
      - type: huggingface
        user: gghfez
        repo: GLM-5-control-vectors
  - key: sokann/GLM-5-GGUF-1.594bpw
    sources:
      - type: huggingface
        user: sokann
        repo: GLM-5-GGUF-1.594bpw
  - key: Maklei/GLM-5-pruned-Q4_K_M-GGUF
    sources:
      - type: huggingface
        user: Maklei
        repo: GLM-5-pruned-Q4_K_M-GGUF
  - key: 0xSero/GLM-5-REAP-50pct-BF16-GGUF
    sources:
      - type: huggingface
        user: 0xSero
        repo: GLM-5-REAP-50pct-BF16-GGUF
  - key: 0xSero/GLM-5-REAP-50pct-UD-IQ2_M-GGUF
    sources:
      - type: huggingface
        user: 0xSero
        repo: GLM-5-REAP-50pct-UD-IQ2_M-GGUF
  - key: DevQuasar/zai-org.GLM-5-GGUF
    sources:
      - type: huggingface
        user: DevQuasar
        repo: zai-org.GLM-5-GGUF
metadataOverrides:
  domain: llm
  architectures:
    - glm-dsa
  compatibilityTypes:
    - gguf
  paramsStrings:
    - 744B-A40B
  minMemoryUsageBytes: 240000000000
  contextLengths:
    - 200000
  vision: false
  reasoning: true
  trainedForToolUse: true
config:
  operation:
    fields:
      - key: llm.prediction.temperature
        value: 1.0
      - key: llm.prediction.topPSampling
        value:
          checked: true
          value: 0.95
      - key: llm.prediction.minPSampling
        value:
          checked: true
          value: 0.01
      - key: llm.prediction.repeatPenalty
        value:
          checked: false
          value: 1.0
customFields:
  - key: enableThinking
    displayName: Enable Thinking
    description: Controls whether the model will think before replying
    type: boolean
    defaultValue: true
    effects:
      - type: setJinjaVariable
        variable: enable_thinking
  - key: clearThinking
    displayName: Clear Thinking
    description: Controls whether thinking content is cleared from history
    type: boolean
    defaultValue: false
    effects:
      - type: setJinjaVariable
        variable: clear_thinking
