metadataOverrides:
  domain: llm
  architectures:
    - glm-dsa
  compatibilityTypes:
    - gguf
  paramsStrings:
    - 754B-A40B
  minMemoryUsageBytes: 240000000000
  contextLengths:
    - 200000
  vision: false
  reasoning: true
  trainedForToolUse: true
config:
  operation:
    fields:
      - key: llm.prediction.temperature
        value: 1.0
      - key: llm.prediction.topPSampling
        value:
          checked: true
          value: 0.95
      - key: llm.prediction.minPSampling
        value:
          checked: true
          value: 0.01
      - key: llm.prediction.repeatPenalty
        value:
          checked: false
          value: 1.0
customFields:
  - key: enableThinking
    displayName: Enable Thinking
    description: Controls whether the model will think before replying
    type: boolean
    defaultValue: true
    effects:
      - type: setJinjaVariable
        variable: enable_thinking
  - key: clearThinking
    displayName: Clear Thinking
    description: Controls whether thinking content is cleared from history
    type: boolean
    defaultValue: false
    effects:
      - type: setJinjaVariable
        variable: clear_thinking
