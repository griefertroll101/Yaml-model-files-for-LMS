config:
  operation:
    fields:
      - key: llm.prediction.temperature
        value: 1.0
      - key: llm.prediction.topKSampling
        value: 64
      - key: llm.prediction.topPSampling
        value:
          checked: true
          value: 0.95
      - key: llm.prediction.reasoning.parsing
        value:
          enabled: true
          startString: "<|channel>thought"
          endString: "<channel|>"
customFields:
  - key: enableThinking
    displayName: Enable Thinking
    description: Controls whether the model will think before replying
    type: boolean
    defaultValue: true
    effects:
      - type: setJinjaVariable
        variable: enable_thinking
metadataOverrides:
  domain: llm
  architectures:
    - gemma4
  compatibilityTypes:
    - gguf
  paramsStrings:
    - 4B
  minMemoryUsageBytes: 2500000000
  contextLengths:
    - 262144
  vision: true
  reasoning: true
  trainedForToolUse: true
